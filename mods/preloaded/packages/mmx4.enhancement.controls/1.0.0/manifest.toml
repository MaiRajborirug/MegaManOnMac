format_version = 5
id = "mmx4.enhancement.controls"
version = "1.0.0"
name = "Mega Man X4 Controls Page"
author = "MaiRajborirug"
description = "OPTION > BUTTON CONFIG opens a keyboard and controller config page in the original screen's style."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "controls-page"
name = "Controls Page"
description = "BUTTON CONFIG rebinds keyboard keys and controller buttons per action. Off keeps Capcom's screen."
group = "Input"
default_enabled = true

[[plugin]]
feature = "controls-page"
id = "mmx4.controls-page"

[[feature]]
id = "prompt-keys"
name = "Keys in Button Prompts"
description = "Capcom's button prompts name your keyboard key: \"✕ (W) ···CHOOSE\". Off keeps the original prompts."
group = "Input"
default_enabled = true

[[plugin]]
feature = "prompt-keys"
id = "mmx4.prompt-keys"
